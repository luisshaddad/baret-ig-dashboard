const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(phrase){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey(
    'raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(LOCK.salt), iterations:LOCK.iterations,
     hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:b64(LOCK.nonce)}, key, b64(LOCK.data));
  return new TextDecoder().decode(plain);
}
document.getElementById('lockform').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('lockerr');
  const btn = e.target.querySelector('button');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Unlocking…';
  try {
    const html = await unlock(document.getElementById('lockpass').value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    // GCM fails closed: a wrong key is indistinguishable from tampering, and
    // either way there is nothing to show.
    err.textContent = 'That passphrase does not open this file.';
    btn.disabled = false; btn.textContent = 'Unlock';
    document.getElementById('lockpass').select();
  }
});
